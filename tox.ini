# This file can be used to customize tox tests as well as other test frameworks like flake8 and mypy

[tox]
envlist = py39
isolated_build = true

[testenv]
allowlist_externals = poetry

commands =
    poetry install -v
    poetry run pytest
    poetry run black --check tap_spicedb/ tests/
    poetry run flake8 tap_spicedb tests
    poetry run pydocstyle tap_spicedb

[testenv:format]
# Attempt to auto-resolve lint errors before they are raised.
# To execute, run `tox -e format`
commands =
    poetry install -v
    poetry run black tap_spicedb/ tests/
    poetry run isort tap_spicedb tests

[flake8]
ignore = W503,E203
max-line-length = 88
max-complexity = 10

[pydocstyle]
ignore = D105,D203,D213
